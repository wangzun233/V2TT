name: Windows checks

on:
  pull_request:
    paths: ['windows/**', '.github/workflows/windows-ci.yml']
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    env:
      CI: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:native
      - run: npx playwright install chromium
      - run: npx playwright test --workers=1
      - run: npm run dist:win -- --publish never
      - run: npm run release:verify
